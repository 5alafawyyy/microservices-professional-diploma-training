server:
  port: 8081

spring:
  application:
    name: product-service
  config:
    # optional: -> the service still starts when the Config Server is down
    # (fail-soft for local development; fail-fast is the production default).
    import: "optional:configserver:http://localhost:8888"

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
