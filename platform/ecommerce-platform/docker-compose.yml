# docker-compose.yml
# Session 9 — Docker Containerization
#
# Every Phase 1 service is now containerized. Start the full platform with:
#   docker compose up -d
#
# 🎯 DESIGN CHOICE — service_healthy vs service_started:
#   Spring Boot services: service_healthy (they expose /actuator/health
#   and their health check can fail if upstream services are not ready)
#   Kafka / Zookeeper: service_started (no HTTP health endpoint to poll)
#   This distinction is explicit and deliberate — see Session 9 docx, Q7.
#
# Startup order (enforced by depends_on):
#   postgres, redis, zookeeper start first (no dependencies)
#   kafka waits for zookeeper: service_started
#   config-server waits for (no dependency — serves from classpath)
#   eureka-server waits for config-server: service_healthy
#   All app services wait for eureka-server + config-server: service_healthy
#   order-service also waits for kafka: service_started
#
# DEV ONLY notes:
#   - SPRING_PROFILES_ACTIVE is not set → uses default (application.yml)
#   - PAYMENT_FAILURE_RATE and PAYMENT_DELAY_MS are tuning knobs exposed
#     here so lab demos can change failure behaviour without editing files
#   - ddl-auto: update is inherited from each service's application.yml;
#     in production replace with Flyway migrations

networks:
  platform-net:
    driver: bridge

volumes:
  postgres-data:
    # Named volume persists PostgreSQL data across docker compose down.
    # Use `docker compose down -v` ONLY for a full clean reset (data loss).

services:

  # ── Infrastructure ─────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    networks:
      - platform-net
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: microservices_pro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    networks:
      - platform-net
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    networks:
      - platform-net
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    networks:
      - platform-net
    depends_on:
      zookeeper:
        condition: service_started   # Zookeeper has no health endpoint
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      # Inside Docker: services reach Kafka via "kafka:9092" (the service name).
      # Note: changed from "localhost:9092" in Phase 1 application.yml files —
      # inside Docker, localhost means the container itself, not Kafka.
      # Each Spring Boot service overrides this via SPRING_KAFKA_BOOTSTRAP_SERVERS.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 5

  # ── Spring Cloud Infrastructure ────────────────────────────────────────

  config-server:
    build:
      context: ./infrastructure/config-server
      dockerfile: Dockerfile
    image: microservices-pro/config-server:local
    container_name: config-server
    networks:
      - platform-net
    ports:
      - "8888:8888"
    environment:
      SPRING_APPLICATION_NAME: config-server
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 5

  eureka-server:
    build:
      context: ./infrastructure/eureka-server
      dockerfile: Dockerfile
    image: microservices-pro/eureka-server:local
    container_name: eureka-server
    networks:
      - platform-net
    ports:
      - "8761:8761"
    environment:
      SPRING_APPLICATION_NAME: eureka-server
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 5

  # ── API Gateway ────────────────────────────────────────────────────────

  api-gateway:
    build:
      context: ./infrastructure/api-gateway
      dockerfile: Dockerfile
    image: microservices-pro/api-gateway:local
    container_name: api-gateway
    networks:
      - platform-net
    ports:
      - "8080:8080"
    environment:
      SPRING_APPLICATION_NAME: api-gateway
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      # Redis — inside Docker, "localhost" does not reach the Redis container
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      # JWT secret — override for a real deployment; dev fallback in application.yml
      # JWT_SECRET: <override-in-production-via-vault>
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 5

  # ── Domain Services ────────────────────────────────────────────────────

  product-service:
    build:
      context: ./services/product-service
      dockerfile: Dockerfile
    image: microservices-pro/product-service:local
    container_name: product-service
    networks:
      - platform-net
    ports:
      - "8081:8081"
    environment:
      SPRING_APPLICATION_NAME: product-service
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/microservices_pro
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 5

  inventory-service:
    build:
      context: ./services/inventory-service
      dockerfile: Dockerfile
    image: microservices-pro/inventory-service:local
    container_name: inventory-service
    networks:
      - platform-net
    ports:
      - "8084:8084"
    environment:
      SPRING_APPLICATION_NAME: inventory-service
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_started   # Kafka has no Spring Boot health endpoint
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 5

  payment-service:
    build:
      context: ./services/payment-service
      dockerfile: Dockerfile
    image: microservices-pro/payment-service:local
    container_name: payment-service
    networks:
      - platform-net
    ports:
      - "8083:8083"
    environment:
      SPRING_APPLICATION_NAME: payment-service
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Lab demo knob — change without editing application.yml
      PAYMENT_FAILURE_RATE: "0.5"
      PAYMENT_DELAY_MS: "0"
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 5

  order-service:
    build:
      context: ./services/order-service
      dockerfile: Dockerfile
    image: microservices-pro/order-service:local
    container_name: order-service
    networks:
      - platform-net
    ports:
      - "8082:8082"
    environment:
      SPRING_APPLICATION_NAME: order-service
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/microservices_pro
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 5

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    image: microservices-pro/notification-service:local
    container_name: notification-service
    networks:
      - platform-net
    ports:
      - "8085:8085"
    environment:
      SPRING_APPLICATION_NAME: notification-service
      SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 40s

  zipkin:
    image: openzipkin/zipkin:3
    container_name: zipkin
    networks:
      - platform-net
    ports:
      - "9411:9411"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9411/health"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus
    networks:
      - platform-net
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  grafana:
    image: grafana/grafana:10.4.2
    container_name: grafana
    networks:
      - platform-net
    ports:
      - "3000:3000"
    volumes:
      - ./observability/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.4
    container_name: keycloak
    networks:
      - platform-net
    ports:
      - "8180:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
    command: start-dev --import-realm
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL",
             "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200'"]
      interval: 15s
      timeout: 10s
      start_period: 60s
      retries: 5
