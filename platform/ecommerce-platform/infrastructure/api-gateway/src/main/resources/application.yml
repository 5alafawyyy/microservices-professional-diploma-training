server:
  port: 8080

spring:
  application:
    name: api-gateway
  config:
    # optional: -> the gateway still starts when the Config Server is down
    # (fail-soft for local development; fail-fast is the production default).
    import: "optional:configserver:http://localhost:8888"
  cloud:
    gateway:
      routes:
        - id: product-service
          uri: lb://PRODUCT-SERVICE   # lb = load balanced via Eureka
          predicates:
            - Path=/api/v1/products/**
          filters:
            - StripPrefix=0
            - AddResponseHeader=X-Platform, microservices-pro

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      enabled: true
